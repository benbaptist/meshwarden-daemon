[project]
name = "meshcore-daemon"
version = "0.1.0"
description = "MeshCore daemon: device gateway, packet logger, gRPC control API and transparent TCP multiplexing proxy"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "meshcore>=2.3,<3",
    "grpcio>=1.60",
    "grpcio-health-checking>=1.60",
    "aiosqlite>=0.19",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools>=1.60",
]

[project.scripts]
meshcore-daemon = "meshcore_daemon.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meshcore_daemon*"]
